name: ci

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        name: test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                # Linux is not optional here: fs.watch's `recursive: true` is
                # verified on macOS but has never been confirmed on Linux, and
                # the watcher's whole design rests on it. See plan/03-watcher.md.
                os: [ubuntu-latest, macos-14]
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  # Pinned, not `latest`: the lockfile format is tied to the Bun
                  # that wrote it, and a newer Bun writing lockfileVersion 2
                  # broke every `--frozen-lockfile` job on the v0.1.0 tag.
                  bun-version: "1.3.14"

            - run: bun install --frozen-lockfile
            - name: Typecheck
              run: bunx tsc --noEmit
            - name: Format check
              run: bunx prettier --check "packages/**/*.ts"
            - name: Test
              run: bun test

            # The correctness tests that must never regress, run explicitly so a
            # failure names itself in the log rather than hiding in the summary.
            - name: Correctness invariants
              run: bun test packages/core/test/queue.test.ts packages/core/test/leader.test.ts

    build:
        name: binary builds
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  # Pinned, not `latest`: the lockfile format is tied to the Bun
                  # that wrote it, and a newer Bun writing lockfileVersion 2
                  # broke every `--frozen-lockfile` job on the v0.1.0 tag.
                  bun-version: "1.3.14"
            - run: bun install --frozen-lockfile
            - name: Compile for the host
              run: bun packages/cli/build-bin.ts
            # A --version smoke test is not enough: v0.1.0 shipped a binary that
            # crashed on the first parse, because web-tree-sitter's runtime wasm
            # was resolved against the build machine's node_modules. Only
            # actually indexing something outside the repo catches that class of
            # bug, so this does a real init + search + symbol lookup.
            - name: The binary must index and search without node_modules
              run: |
                  crux="$GITHUB_WORKSPACE/packages/cli/dist/bin/linux-x64/crux"
                  demo="$(mktemp -d)"
                  mkdir -p "$demo/src"
                  printf 'export class RetryPolicy {\n  execute() { return flushBuffer(); }\n}\n' > "$demo/src/retry.ts"
                  printf 'def get_user_by_id(uid):\n    return db.find(uid)\n' > "$demo/src/users.py"

                  cd /tmp
                  "$crux" --version
                  "$crux" init "$demo"

                  # Symbols only exist if a grammar actually parsed the file.
                  "$crux" symbol RetryPolicy "$demo" | grep -q "RetryPolicy"
                  "$crux" symbol get_user_by_id "$demo" | grep -q "get_user_by_id"
                  "$crux" search "retry" "$demo" | grep -q "retry.ts"
                  "$crux" status "$demo" | grep -q "symbols"
                  echo "binary indexes, parses, and searches correctly"
